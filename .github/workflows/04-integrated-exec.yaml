# CI de nivel 04: Disparo dos testes dentro da pipe de dev

name: 'Execução Integrada'

on:
  workflow_dispatch:

jobs:
  inspecao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalando yarn
        run: npm install -g yarn

      - name: Instalando dependências
        run: yarn

      - name: Checando padronizacao do código
        run: yarn lint

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - name: Instalando yarn
        run: npm install -g yarn

      - name: Instalando dependências
        run: yarn

      - name: Executando testes de unidade
        run: yarn test

  e2e-tests:
    # Máquina que o job vai executar
    runs-on: ubuntu-latest
    needs: [inspecao]

    # Passos do script de build
    steps:
      # Clone do projeto
      - uses: actions/checkout@v4

      # Instalação Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: latest

      # Instalação yarn
      - name: Instalando yarn
        run: npm install -g yarn

      # Instalação de dependências
      - name: Instalando dependências
        run: yarn

      # Instalação Playwright
      - name: Instalando playwright
        run: yarn playwright install

      # Executar os testes E2E
      - name: Executando testes E2E
        run: yarn run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio
          path: ./playwright-report

  deploy:
    runs-on: ubuntu-latest
    needs: [e2e-tests]

    steps:
      - name: Simulação de deploy
        run: echo "simulando o deploy com sucesso"
